<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fde3d0">
<meta name="mobile-web-app-capable" content="yes">
<title>ばあちゃんベル</title>
<style>
  :root{
    --bg:#ffffff; --peach:#fde3d0; --peach-ink:#c4622d; --ink:#2b2420; --muted:#8a7f76; --line:#eee4dc;
    --bell:#e4572e; --bell-dark:#b8401d; --ok:#2e9e5b; --err:#c0392b;
    --c-baachan:#e4572e; --c-tom:#2f6fdb; --c-matthew:#2e9e5b; --c-guest:#7a7a7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  /* ⚙️ settings (long-press) + tiny connection dot */
  .gear{position:relative;flex:none;width:40px;height:40px;border:none;border-radius:50%;background:transparent;
    font-size:22px;line-height:40px;padding:0;opacity:.75;touch-action:none;user-select:none;-webkit-user-select:none}
  .gear .conn{position:absolute;right:3px;bottom:5px;width:7px;height:7px;border-radius:50%;background:#ccc}
  body.online .gear .conn{background:var(--ok)}

  /* chat */
  #chat{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:6px}
  /* one compact line per message, thin underline in the sender's colour with a small tail */
  .msg{--c:var(--ink);flex-shrink:0;position:relative;max-width:92%;align-self:flex-start;padding:2px 2px 3px;
    border-bottom:2px solid var(--c);font-size:16px;line-height:1.4;word-break:break-word}
  .msg:not(.right){border-left:2px solid var(--c);border-bottom-left-radius:14px;padding-left:9px}
  .msg.right{align-self:flex-end;text-align:right}
  .msg.right::after{content:"";position:absolute;bottom:-7px;right:-1px;border-top:6px solid var(--c);border-left:7px solid transparent}
  .msg .name{font-weight:700;color:var(--c);margin-right:6px}
  .msg .text{white-space:pre-wrap}
  .msg .time{color:var(--muted);font-size:.8em;margin-left:6px;white-space:nowrap}
  .msg .time.fresh{color:#1f6e3f;font-weight:700}
  .msg.alert .text{font-weight:700;color:var(--c)}
  /* ばあちゃん's own button presses, on her screen: coloured icon badge + time */
  .msg.badgeRow{border:none;padding:0;display:flex;align-items:center;gap:6px}
  .msg.badgeRow::after{display:none}
  .badge{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:19px;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .empty{margin:auto;color:var(--muted);font-size:16px;text-align:center}
  body.baachan .msg{font-size:19px}

  /* bachan's button */
  #bellArea{flex:none;padding:22px 12px 12px;display:none;background:linear-gradient(to top,var(--peach) 0%,#fff 100%)}
  body.baachan #bellArea{display:flex;gap:10px;height:32vh;min-height:200px}
  #bellLeft{flex:0 0 55%;position:relative;display:flex;align-items:center;justify-content:center}
  #bellLeft .gear{position:absolute;left:-6px;bottom:-6px}
  #bellArea button{border:none;color:#fff;font-weight:800;font-family:inherit;user-select:none;-webkit-user-select:none}
  #bellArea button:disabled{opacity:1}
  #bell{width:150px;height:150px;flex:none;border-radius:50%;background:var(--bell);margin-bottom:8px;
    font-size:30px;letter-spacing:1px;box-shadow:0 8px 0 var(--bell-dark);padding:0}
  #bell:active{transform:translateY(6px);box-shadow:0 2px 0 var(--bell-dark)}
  #quick{flex:1;display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  #quick button{flex:1;border-radius:16px;font-size:min(28px,6.5vw)}
  #quick button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #ohayo{background:#f2b705;color:#3a2a00 !important;box-shadow:0 6px 0 #b98b00}
  #kaiketsu{background:#2e9e5b;box-shadow:0 6px 0 #1f6e3f}
  #okBtn{background:#2f6fdb;box-shadow:0 6px 0 #1f4fa3}
  #bellArea button.sent{background:var(--ok) !important;color:#fff !important;box-shadow:0 6px 0 #1f6e3f}
  #bellArea button.fail{background:var(--err) !important;color:#fff !important;box-shadow:0 6px 0 #8a2a20}
  #bell.sent{font-size:.75em}
  #bell.fail{font-size:.5em;letter-spacing:0;padding:0 18px}

  /* long-press progress circle */
  #holdRing{position:fixed;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;z-index:11;
    display:none;pointer-events:none}
  #holdRing.show{display:block}
  #holdRing .bg{fill:rgba(255,255,255,.95);stroke:#f5d3bf;stroke-width:2}
  #holdRing .pie{fill:none;stroke:#f5a97f;stroke-width:50;transform:rotate(-90deg);transform-origin:80px 80px;
    stroke-dasharray:157.08;stroke-dashoffset:157.08}
  #holdRing.show .pie{animation:fillPie 2s linear forwards}
  @keyframes fillPie{to{stroke-dashoffset:0}}

  /* text input for everyone else */
  #composer{flex:none;display:flex;align-items:center;gap:6px;padding:10px;border-top:1px solid var(--line);background:#fff}
  body.baachan #composer{display:none}
  #input{flex:1;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:22px;outline:none;font-family:inherit}
  #send{border:none;background:transparent;color:var(--c-tom);font-size:22px;padding:0 6px;line-height:1}
  #send:disabled{opacity:.4}

  /* account menu */
  #menu{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10}
  #menu.open{display:flex}
  #menu .box{background:#fff;border-radius:18px;padding:18px;width:min(320px,86vw);display:flex;flex-direction:column;gap:10px}
  #menu h2{margin:0 0 4px;font-size:16px;color:var(--muted);font-weight:600}
  #menu button{font-size:20px;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:inherit;text-align:left}
  #menu button.current{border-color:var(--ink)}

  /* big popup for new replies (bachan only) */
  #popup{position:fixed;left:4vw;right:4vw;top:18vh;background:#fff;border-radius:24px;padding:24px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:9;display:none;text-align:center}
  #popup.show{display:block;animation:pop .25s ease-out}
  #popup .name{font-size:26px;font-weight:800;margin-bottom:8px}
  #popup .text{font-size:36px;line-height:1.4;word-break:break-word}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body class="baachan">

<main id="chat"></main>

<div id="bellArea">
  <div id="bellLeft">
    <button id="bell">ピンポン</button>
    <button class="gear" aria-label="設定（長押し）">⚙️<span class="conn"></span></button>
  </div>
  <div id="quick">
    <button id="ohayo">おはよう</button>
    <button id="kaiketsu">解決</button>
    <button id="okBtn">OK</button>
  </div>
</div>

<svg id="holdRing" viewBox="0 0 160 160" aria-hidden="true">
  <circle class="bg" cx="80" cy="80" r="76"/>
  <circle class="pie" cx="80" cy="80" r="25"/>
</svg>

<form id="composer" autocomplete="off">
  <button type="button" class="gear" aria-label="Settings (hold)">⚙️<span class="conn"></span></button>
  <input id="input" maxlength="500" placeholder="ばあちゃん: Type a message…" enterkeyhint="send">
  <button id="send" type="submit" aria-label="Send">▶</button>
</form>

<div id="menu">
  <div class="box">
    <h2>だれが使っていますか？</h2>
    <button data-user="ばあちゃん">ばあちゃん</button>
    <button data-user="Tom">Tom</button>
    <button data-user="Matthew">Matthew</button>
    <button data-user="ゲスト">ゲスト</button>
  </div>
</div>

<div id="popup"><div class="name"></div><div class="text"></div></div>

<script>
// ===== Settings =====
const SERVER     = "https://ntfy.sh";
const CHAT_TOPIC = "barchan-bell-chat-838sjqnlsztj";  // page-only chat
const PING_TOPIC = "barchan-bell-ping-8u8yaapvuyte";  // subscribe to THIS in the ntfy app
const PAGE_URL   = "https://treetoptomoya.github.io/barchan-bell/";
const REPLY_URL  = PAGE_URL + "?from=ntfy";        // opened from the notification
const STORE_KEY  = "barchan-bell-history";
// ばあちゃん's buttons. priority 5 = loud/urgent, 3 = normal notification sound.
const ALERTS = {
// title/body = the phone notification (English, for Tom & Matthew); chat = line in the page.
  ping:     {btn:"#bell",     label:"ピンポン", priority:5, cooldown:10000, icon:"🔔", color:"#e4572e",
             title:"🔔 Grandma is calling you",   body:"Tap to reply",  chat:"🔔 ピンポンしました"},
  ohayo:    {btn:"#ohayo",    label:"おはよう", priority:3, cooldown:5000,  icon:"☀️", color:"#f2b705",
             title:"☀️ Good morning from Grandma", body:"Tap to reply",  chat:"☀️ おはよう！"},
  kaiketsu: {btn:"#kaiketsu", label:"解決",     priority:3, cooldown:5000,  icon:"✅", color:"#2e9e5b",
             title:"✅ Sorted, all fine now",       body:"From Grandma",  chat:"✅ 解決（もう大丈夫）"},
  ok:       {btn:"#okBtn",    label:"OK",       priority:3, cooldown:5000,  icon:"👌", color:"#2f6fdb",
             title:"👌 OK",                         body:"From Grandma",  chat:"👌 OK"}
};
const COLORS = {"ばあちゃん":"var(--c-baachan)","Tom":"var(--c-tom)","Matthew":"var(--c-matthew)","ゲスト":"var(--c-guest)"};

// ===== State =====
let user = "ばあちゃん";           // always start as ばあちゃん
let messages = [];                // {id,time,from,text,type}
const seen = new Set();
let lastId = null;
let es = null;

const $ = s => document.querySelector(s);
const chat = $("#chat");

// ===== Storage (best effort) =====
function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); d.forEach(m=>add(m,false)); }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(messages.slice(-300))); }catch(e){}
}

// ===== Time labels =====
function rel(t){
  const s = Math.floor(Date.now()/1000 - t);
  if (s < 60) return "たった今";
  if (s < 3600) return Math.floor(s/60) + "分前";
  if (s < 86400) return Math.floor(s/3600) + "時間前";
  const d = new Date(t*1000);
  return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

// ===== Rendering =====
function render(){
  chat.innerHTML = "";
  if (!messages.length){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = "まだメッセージはありません"; chat.appendChild(e); return;
  }
  for (const m of messages){
    const el = document.createElement("div");
    const isAlert = !!ALERTS[m.type];
    // ばあちゃん on the right, everyone else on the left
    el.className = "msg" + (m.from==="ばあちゃん" ? " right" : "") + (isAlert ? " alert" : "");
    el.style.setProperty("--c", COLORS[m.from] || "var(--ink)");
    if (isAlert && user==="ばあちゃん"){
      // her own presses, on her screen: just a coloured icon badge + time
      el.className += " badgeRow";
      const b = document.createElement("span"); b.className="badge";
      b.style.background = ALERTS[m.type].color; b.textContent = ALERTS[m.type].icon;
      const t = document.createElement("span"); t.className="time"; t.dataset.t=m.time;
      el.append(b,t); chat.appendChild(el); continue;
    }
    const n = document.createElement("span"); n.className="name"; n.textContent=m.from;
    const tx = document.createElement("span"); tx.className="text";
    tx.textContent = isAlert ? ALERTS[m.type].chat : m.text;
    const t = document.createElement("span"); t.className="time"; t.dataset.t=m.time;
    el.append(n,tx,t); chat.appendChild(el);
  }
  updateTimes();
  chat.scrollTop = chat.scrollHeight;
}
function updateTimes(){
  document.querySelectorAll(".time").forEach(el=>{
    const t = +el.dataset.t;
    el.textContent = rel(t);
    el.classList.toggle("fresh", Date.now()/1000 - t < 60);   // たった今 in dark green
  });
}
setInterval(updateTimes, 15000);

// ===== Incoming messages =====
function parse(ev){
  // ev = ntfy event {id,time,event,message}
  let body;
  try{ body = JSON.parse(ev.message); }catch(e){ body = {from:"?", text:ev.message}; }
  return {id:ev.id, time:ev.time, from:body.from||"?", text:String(body.text||""), type:body.type||"text"};
}
function add(m, live){
  if (!m || seen.has(m.id)) return false;
  seen.add(m.id);
  messages.push(m);
  messages.sort((a,b)=>a.time-b.time);
  lastId = messages[messages.length-1].id;
  if (live && user==="ばあちゃん" && m.from!=="ばあちゃん" && Date.now()/1000 - m.time < 60){
    chime(); popup(m);
  }
  return true;
}

async function poll(){
  try{
    const r = await fetch(`${SERVER}/${CHAT_TOPIC}/json?poll=1&since=all`);
    const txt = await r.text();
    let changed = false;
    txt.split("\n").forEach(line=>{
      if (!line.trim()) return;
      try{ const ev = JSON.parse(line); if (ev.event==="message" && add(parse(ev),false)) changed = true; }catch(e){}
    });
    if (changed){ save(); render(); }
  }catch(e){}
}

function connect(){
  if (es) es.close();
  const since = lastId ? `?since=${lastId}` : "";
  es = new EventSource(`${SERVER}/${CHAT_TOPIC}/sse${since}`);
  es.onopen = ()=>document.body.classList.add("online");
  es.onmessage = e=>{
    try{
      const ev = JSON.parse(e.data);
      if (ev.event==="message" && add(parse(ev),true)){ save(); render(); }
    }catch(err){}
  };
  es.onerror = ()=>{
    document.body.classList.remove("online");
    es.close(); es = null;
    setTimeout(connect, 4000);
  };
}
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState==="visible"){ poll().then(connect); }
});

// ===== Sending =====
function sendJSON(obj){
  return fetch(SERVER, {method:"POST", body:JSON.stringify(obj)}).then(r=>{ if(!r.ok) throw new Error(r.status); });
}
function sendChat(payload){
  return sendJSON({topic:CHAT_TOPIC, message:JSON.stringify(payload)});
}

// ===== ばあちゃん's buttons (ピンポン / おはよう / 解決 / OK) =====
Object.entries(ALERTS).forEach(([type, a])=>{
  const b = $(a.btn);
  b.addEventListener("click", async ()=>{
    unlockAudio();
    if (b.disabled) return;
    b.disabled = true;
    const reset = ()=>{ b.className=""; b.textContent=a.label; b.disabled=false; sizeBell(); };
    try{
      await sendJSON({topic:PING_TOPIC, title:a.title, message:a.body, priority:a.priority,
        click:REPLY_URL, actions:[{action:"view", label:"返信する", url:REPLY_URL, clear:true}]});
      sendChat({from:"ばあちゃん", type, text:""}).catch(()=>{});
      b.className="sent"; b.textContent = type==="ping" ? "送りました ✓" : "✓"; sizeBell();
      setTimeout(reset, a.cooldown);
    }catch(e){
      b.className="fail"; b.textContent = type==="ping" ? "送れませんでした。もう一度押してね" : "✕"; sizeBell();
      setTimeout(reset, 3000);
    }
  });
});

// ===== Text messages (Tom / Matthew / ゲスト) =====
$("#composer").addEventListener("submit", async e=>{
  e.preventDefault();
  const input = $("#input"), text = input.value.trim();
  if (!text) return;
  $("#send").disabled = true;
  try{ await sendChat({from:user, type:"text", text}); input.value=""; }
  catch(err){ alert("送れませんでした。もう一度試してください。"); }
  $("#send").disabled = false; input.focus();
});

// ===== Chime + popup =====
let actx = null;
function unlockAudio(){
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state==="suspended") actx.resume();
  }catch(e){}
}
document.addEventListener("pointerdown", unlockAudio, {once:false, passive:true});
function chime(){
  if (!actx) return;
  const now = actx.currentTime;
  [[880,0],[660,0.35]].forEach(([f,d])=>{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001, now+d);
    g.gain.exponentialRampToValueAtTime(0.4, now+d+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+d+1.2);
    o.connect(g).connect(actx.destination); o.start(now+d); o.stop(now+d+1.3);
  });
}
let popTimer;
function popup(m){
  const p = $("#popup");
  p.querySelector(".name").textContent = m.from + " より";
  p.querySelector(".name").style.color = COLORS[m.from] || "var(--ink)";
  p.querySelector(".text").textContent = m.text;
  p.classList.add("show");
  clearTimeout(popTimer); popTimer = setTimeout(()=>p.classList.remove("show"), 8000);
}
$("#popup").addEventListener("click", ()=>$("#popup").classList.remove("show"));

// ===== Long-press menu =====
let holdTimer;
const ring = $("#holdRing");
function holdStart(e){
  e.preventDefault();
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}   // keep holding even if finger drifts
  ring.classList.remove("show"); void ring.getBoundingClientRect(); ring.classList.add("show"); // restart animation
  holdTimer = setTimeout(openMenu, 2000);
}
function holdEnd(){ ring.classList.remove("show"); clearTimeout(holdTimer); }
document.querySelectorAll(".gear").forEach(g=>{
  g.addEventListener("pointerdown", holdStart);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>g.addEventListener(ev, holdEnd));
  g.addEventListener("contextmenu", e=>e.preventDefault());
});
function openMenu(){
  holdEnd();
  document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("current", b.dataset.user===user));
  $("#menu").classList.add("open");
}
$("#menu").addEventListener("click", e=>{
  const b = e.target.closest("button[data-user]");
  if (b) setUser(b.dataset.user);
  $("#menu").classList.remove("open");
});
function setUser(u){
  user = u;
  $("#input").placeholder = u + ": Type a message…";
  document.body.classList.toggle("baachan", u==="ばあちゃん");
  render(); sizeBell();
}

// ===== Round ピンポン: as big a circle as the left area allows =====
function sizeBell(){
  const area = $("#bellLeft"); if (!area.clientWidth) return;
  const d = Math.max(90, Math.min(area.clientWidth, area.clientHeight - 10));
  const b = $("#bell");
  b.style.width = b.style.height = d + "px";
  const k = b.classList.contains("fail") ? 0.085 : b.classList.contains("sent") ? 0.13 : 0.2;
  b.style.fontSize = Math.round(d * k) + "px";
}
window.addEventListener("resize", sizeBell);

// ===== Start =====
sizeBell();
load(); render();
poll().then(()=>{ render(); connect(); });

// Opened from the ntfy notification → ask who's replying.
// The ?from=ntfy is removed right away, so a reload still opens as ばあちゃん.
if (new URLSearchParams(location.search).get("from")==="ntfy"){
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  openMenu();
}
</script>
</body>
</html>
